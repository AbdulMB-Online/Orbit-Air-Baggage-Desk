# Codex project configuration. Requires a trusted project and reviewed hook.
# Restart the local Codex session after installing or changing this file.
default_permissions = "orbit-air"

[features]
hooks = true

[permissions.orbit-air]
description = "Workspace editing with .env files denied"
extends = ":workspace"

[permissions.orbit-air.filesystem.":workspace_roots"]
".env" = "deny"
"**/.env" = "deny"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = '/bin/sh "$(git rev-parse --show-toplevel)/.codex/hooks/pytest_stop.sh"'
timeout = 120
statusMessage = "Running the project pytest suite"

# Review/trust this hook through /hooks; do not bypass hook trust.
# Permission documentation: https://learn.chatgpt.com/docs/permissions
# Hook documentation: https://learn.chatgpt.com/docs/hooks

# STRETCH GOAL 1: guard Codex patch edits before they run.
[[hooks.PreToolUse]]
matcher = "^apply_patch$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/hooks/protect_tests.py"'
timeout = 10
statusMessage = "Protecting test files"
